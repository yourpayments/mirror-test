stages:
  - sync

# Cleanup project and sync with public repos
# on:
# - github.com
# - gitflic.com

variables:
  COMMIT_USER_NAME: "GitLab Mirroring Bot"
  COMMIT_USER_EMAIL: "mirror-bot@localhost.com"
  COMMIT_MESSAGE: "Cleanup repository for public mirrors [skip ci]"
  GIT_USER: "ypmn"
  GIT_PROJECT: "mirror-test.git"

mirror_public:
  stage: sync
  tags:
    - docker
  image: alpine:latest
  before_script:
    - apk add --no-cache git openssh-client coreutils
    - mkdir -p /root/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > /root/.ssh/id_rsa
    - chmod 600 /root/.ssh/id_rsa
    - ssh-keyscan github.com >> /root/.ssh/known_hosts
    - ssh-keyscan gitflic.ru >> /root/.ssh/known_hosts

  script:
    - git clean -fd
    - git checkout -B public-dist

    - git rm -rf --ignore-unmatch .gitlab-ci.yml ci

    - git config --global user.name "$COMMIT_USER_NAME"
    - git config --global user.email "$COMMIT_USER_EMAIL"
    - git commit -m "$COMMIT_MESSAGE"

    # - git remote remove github || true
    - git remote remove gitflic || true

    - git remote add gitflic "git@gitflic.ru:ypmn-test-company/mirror-test.git"
    # - git remote add github  "git@github.com:$GIT_USER/$GIT_PROJECT"

    - git push -f gitflic public-dist:main
    # - git push -f github public-dist:main

  # rules:
  #   - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
